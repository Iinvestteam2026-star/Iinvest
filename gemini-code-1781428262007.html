<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل حضور الفعالية</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
  <style>
    body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .register-card { border: none; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
    .btn-submit { background-color: #157347; border: none; font-weight: bold; }
    .btn-submit:hover { background-color: #115c38; }
  </style>
</head>
<body>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card register-card p-4 bg-white">
          
          <div class="text-center mb-4">
            <h3 class="fw-bold text-dark">تسجيل حضور الفعالية</h3>
            <div id="eventBadge" class="badge bg-success fs-6 mt-2 d-none"></div>
            <div id="noEventAlert" class="alert alert-danger d-none mt-2">عذراً، يجب الدخول عبر الرابط المخصص للفعالية.</div>
          </div>
          
          <form id="registrationForm">
            <div class="mb-3">
              <label class="form-label fw-bold">الاسم بالكامل (إجباري)</label>
              <input type="text" id="name" class="form-control" required placeholder="اكتب اسمك الثلاثي أو الرباعي">
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">النوع</label>
              <select id="gender" class="form-select">
                <option value="طالب">طالب</option>
                <option value="طالبة">طالبة</option>
              </select>
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">رقم الهاتف</label>
              <input type="tel" id="phone" class="form-control" required placeholder="01xxxxxxxxx">
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">الجامعة</label>
              <input type="text" id="university" class="form-control" required placeholder="مثال: جامعة أسيوط">
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">الكلية (اختياري)</label>
              <input type="text" id="college" class="form-control" placeholder="مثال: كلية التجارة">
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">الفرقة الدراسية</label>
              <select id="grade" class="form-select">
                <option value="الفرقة الأولى">الفرقة الأولى</option>
                <option value="الفرقة الثانية">الفرقة الثانية</option>
                <option value="الفرقة الثالثة">الفرقة الثالثة</option>
                <option value="الفرقة الرابعة">الفرقة الرابعة</option>
                <option value="خريج">خريج</option>
              </select>
            </div>
            
            <div class="mb-4">
              <label class="form-label fw-bold">التاريخ</label>
              <input type="date" id="date" class="form-control" required>
            </div>
            
            <button type="submit" id="submitBtn" class="btn btn-primary btn-submit w-100 py-2 fs-5">تسجيل الحضور</button>
          </form>
          
          <div id="successMessage" class="text-center d-none py-4">
            <div class="alert alert-success fs-5 fw-bold mb-3">✅ تم تسجيل بياناتك بنجاح</div>
            <button onclick="reloadForm()" class="btn btn-outline-secondary">إرسال رد آخر</button>
          </div>
          
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx1rcK8A18vWEl79CSB4zqFcb8XUoTheRsz8m3B27J4U0z6IlpcrfAu2qmxSIBX1j4u/exec";
    
    // استخراج اسم الفعالية من الرابط التلقائي لقراءة ?event=...
    const urlParams = new URLSearchParams(window.location.search);
    const eventName = urlParams.get('event');
    
    // إعداد تاريخ اليوم الافتراضي
    document.getElementById('date').value = new Date().toISOString().substring(0, 10);
    
    if (eventName) {
      const badge = document.getElementById('eventBadge');
      badge.innerText = decodeURIComponent(eventName);
      badge.classList.remove('d-none');
    } else {
      document.getElementById('noEventAlert').classList.remove('d-none');
      document.getElementById('registrationForm').classList.add('d-none');
    }
    
    // إرسال البيانات إلى السيرفر
    document.getElementById('registrationForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "جاري حفظ البيانات...";
      
      const payload = {
        action: "register",
        eventName: eventName,
        studentData: {
          name: document.getElementById('name').value,
          gender: document.getElementById('gender').value,
          phone: document.getElementById('phone').value,
          university: document.getElementById('university').value,
          college: document.getElementById('college').value,
          grade: document.getElementById('grade').value,
          date: document.getElementById('date').value
        }
      };
      
      fetch(API_URL, {
        method: "POST",
        mode: "cors",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        submitBtn.disabled = false;
        submitBtn.innerText = "تسجيل الحضور";
        
        if (data.status === 'success') {
          document.getElementById('registrationForm').classList.add('d-none');
          document.getElementById('successMessage').classList.remove('d-none');
        } else {
          alert(data.message);
        }
      })
      .catch(err => {
        submitBtn.disabled = false;
        submitBtn.innerText = "تسجيل الحضور";
        alert("حدث خطأ في الاتصال بالسيرفر، يرجى المحاولة مرة أخرى.");
        console.error(err);
      });
    });
    
    function reloadForm() {
      document.getElementById('name').value = '';
      document.getElementById('phone').value = '';
      document.getElementById('college').value = '';
      document.getElementById('registrationForm').classList.remove('d-none');
      document.getElementById('successMessage').classList.add('d-none');
    }
  </script>
</body>
</html>
